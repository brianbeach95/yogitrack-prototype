<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YogiTrack • View Attendance</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body class="layout--sidebar">

  <aside class="sidebar">
    <a class="logo-wrap" href="dashboard.html">
      <img src="../images/Logo.png" alt="YogiTrack Logo" class="logo">
    </a>

    <nav class="nav">
      <a href="instructor.html">Instructors</a>
      <a href="package.html">Packages</a>
      <a href="class.html">Classes</a>
      <a href="schedule.html">Class Schedule</a>
      <a href="customer.html">Customers</a>
      <a href="sale.html">Sales</a>
      <a href="attendance.html">Check-ins</a>
      <a href="viewAttendance.html">View Attendance</a>
      <a href="reports.html">Reports</a>
      <a href="../index.html">Log Out</a>
    </nav>
  </aside>

  <main class="layout--center">

    <div class="card card--wide">

      <h2 class="text--center">Class Attendance</h2>

      <label>
        Filter by Class
        <select
          id="classFilter"
          class="styled-select"
        >
          <option value="">All Classes</option>
        </select>
      </label>

      <table class="data-table">
        <thead>
          <tr>
            <th>Attendance ID</th>
            <th>Class</th>
            <th>Customer</th>
            <th>Date / Time</th>
          </tr>
        </thead>

        <tbody id="attendanceTableBody">
        </tbody>
      </table>

      <div class="btn-row">
        <a href="dashboard.html" class="btn">Exit</a>
      </div>

    </div>

  </main>

  <script src="../js/viewAttendance.js"></script>

</body>
</html>
