<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YogiTrack • Packages</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="layout--sidebar">
  <!-- Re-use the same sidebar -->
  <aside class="sidebar">
    <a class="logo-wrap" href="dashboard.html">
      <img src="../images/Logo.png" alt="YogaTrack Logo" class="logo">
    </a>
    <nav class="nav">
        <a href="instructor.html">Instructors</a>
        <a href="package.html">Packages</a>
        <a href="#">Class Schedule</a>
        <a href="customer.html">Customers</a>
        <a href="#">Check-ins</a>
        <a href="../index.html">Log Out</a>
    </nav>
  </aside>

  <!-- Package form -->
  <main class="layout--center">
  <form class="card" id="packageForm">
    <h2>Package Details</h2>

    <label id="packageIdLabel" for="packageIdSelect"> Package ID
      <select name="packageId" id="packageIdSelect" class="form-input">
        <option value=""> -- Select Package Id --</option>
      </select>
    </label>

    <div id="packageIdAddSelection" style="display: none;">
      <label> Package ID
        <input id="packageIdText" type="text" name="packageId" readonly>
      </label>
    </div>

    <label> Package Name
      <input type="text" name="packageName">
    </label>

    <div class="grid-2">
      <label> Package Category
        <select name="packageCategory" class="form-input">
          <option value="">-- Select Category --</option>
          <option value="General">General</option>
          <option value="Senior">Senior</option>
        </select>
      </label>

      <label> Number of Classes
        <select name="numberOfClasses" class="form-input">
          <option value="">-- Select Number --</option>
          <option value="1">1</option>
          <option value="4">4</option>
          <option value="10">10</option>
          <option value="Unlimited">Unlimited</option>
        </select>
      </label>
    </div>

    <div class="grid-2">
      <label> Class Type
        <select name="classType"class="form-input">
          <option value="">-- Select Class Type --</option>
          <option value="General">General</option>
          <option value="Special">Special</option>
        </select>
      </label>

      <label> Price
        <input type="number" name="price" min="0" step="0.01">
      </label>
    </div>

    <div class="grid-2">
      <label> Start Date
        <input type="date" name="startDate">
      </label>

      <label> End Date
        <input type="date" name="endDate">
      </label>
    </div>

    <div class="button-row">
      <button type="button" class="btn btn--primary" id="addBtn">Add</button>
      <button type="button" class="btn" id="saveBtn">Save</button>
      <button type="button" class="btn" id="clearBtn">Clear</button>
    </div>
  </form>
</main>

<script src="../js/package.js"></script>
</body>
</html>
