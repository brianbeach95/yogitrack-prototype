<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YogiTrack • Class Schedule</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="background">
        <div class="overlay">
            <div class="layout--sidebar">
                <aside class="sidebar">
                    <a class="logo-wrap" href="dashboard.html">
                        <img src="../images/Logo.png"
                             alt="YogiTrack Logo"
                             class="logo">
                    </a>

                    <nav class="nav">
                        <a href="instructor.html">Instructors</a>
                        <a href="package.html">Packages</a>
                        <a href="class.html">Classes</a>
                        <a href="schedule.html">Class Schedule</a>
                        <a href="customer.html">Customers</a>
                        <a href="sale.html">Sales</a>
                        <a href="attendance.html">Check-ins</a>
                        <a href="viewAttendance.html">View Attendance</a>
                        <a href="reports.html">Reports</a>
                        <a href="../index.html">Log Out</a>
                    </nav>
                </aside>

                <main class="main-fill">
                    <div class="card card--wide">

                        <h1 class="text--center">Class Schedule</h1>

                        <label for="instructorFilter">
                            Filter by Instructor
                        </label>

                        <select id="instructorFilter" class="styled-select">
                            <option value="">All Instructors</option>
                        </select>

                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Class ID</th>
                                    <th>Instructor</th>
                                    <th>Day</th>
                                    <th>Time</th>
                                    <th>Class Type</th>
                                </tr>
                            </thead>

                            <tbody id="scheduleTableBody">
                            </tbody>
                        </table>

                        <div class="btn-row">
                            <a href="dashboard.html" class="btn">Exit</a>
                        </div>

                    </div>
                </main>

            </div>
        </div>
    </div>

    <script src="../js/schedule.js"></script>
</body>
</html>
