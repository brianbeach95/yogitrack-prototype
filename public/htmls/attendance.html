<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YogiTrack • Check-ins</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body class="layout--sidebar">

  <aside class="sidebar">
    <a class="logo-wrap" href="dashboard.html">
      <img src="../images/Logo.png" alt="YogiTrack Logo" class="logo">
    </a>

    <nav class="nav">
      <a href="instructor.html">Instructors</a>
      <a href="package.html">Packages</a>
      <a href="class.html">Classes</a>
      <a href="schedule.html">Class Schedule</a>
      <a href="customer.html">Customers</a>
      <a href="sale.html">Sales</a>
      <a href="attendance.html">Check-ins</a>
      <a href="viewAttendance.html">View Attendance</a>
      <a href="reports.html">Reports</a>
      <a href="../index.html">Log Out</a>
    </nav>
  </aside>

  <main class="layout--center">
    <form class="card" id="attendanceForm">

      <h2>Class Check-in</h2>

      <label>Attendance ID
        <input
          type="text"
          name="attendanceId"
          id="attendanceId"
          readonly
        >
      </label>
      <label>Instructor
        <select
          name="instructorId"
          id="instructorId"
          class="form-input"
          required
        >
          <option value="">-- Select Instructor --</option>
        </select>
      </label>

      <label>Class
        <select
          name="classId"
          id="classId"
          class="form-input"
          required
          disabled
        >
          <option value="">-- Select Instructor First --</option>
        </select>
      </label>

      <label>Customer
        <select
          name="customerId"
          id="customerId"
          class="form-input"
          required
        >
          <option value="">-- Select Customer --</option>
        </select>
      </label>

      <div class="grid-2">

        <label>Current Class Balance
          <input
            type="number"
            id="classBalance"
            readonly
          >
        </label>

        <label>Attendance Date/Time
          <input
            type="datetime-local"
            name="attendanceDateTime"
            id="attendanceDateTime"
            required
          >
        </label>

      </div>

      <div class="btn-row">
        <button
          type="button"
          class="btn btn--primary"
          id="checkInBtn"
        >
          Check In
        </button>

        <button
          type="button"
          class="btn"
          id="clearBtn"
        >
          Clear
        </button>
      </div>

    </form>
  </main>

  <script src="../js/attendance.js"></script>

</body>
</html>
